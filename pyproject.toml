[project]
name = "frontend"
version = "0.1.0"
description = "euroone python frontend Istvan Toth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "nicegui>=3.18.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pdoc>=16.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.mypy]
plugins = ["pydantic.mypy"]
